name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          if desc="$(git describe --tags --first-parent 2>/dev/null)"; then
            version="$(printf '%s' "$desc" | sed -E 's/^v//; s/(.*)-g([0-9a-f]+)$/\1+g\2/')"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "cell ${version}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -ldflags "-X github.com/ykhoroshevskiy-tech/cell/internal/version.Version=${version}" \
              -o "dist/cell-${version}-linux-${arch}" ./cmd/cell
          done
      - name: Checksums
        run: cd dist && sha256sum cell-* > checksums-sha256.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
