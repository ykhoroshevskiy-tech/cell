name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build (git-derived version)
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          if desc="$(git describe --tags --first-parent 2>/dev/null)"; then
            version="$(printf '%s' "$desc" | sed -E 's/^v//; s/(.*)-g([0-9a-f]+)$/\1+g\2/')"
          else
            version="0.0.0-dev+g${short_sha}"
          fi
          echo "cell ${version}"
          go build -ldflags "-X github.com/ykhoroshevskiy-tech/cell/internal/version.Version=${version}" -o cell ./cmd/cell
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          fail_ci_if_error: false
      - name: Behavioral gates (unprivileged)
        run: |
          ./cell version | grep -E '^cell [0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?(\+g[0-9a-f]+)?([^+]*dirty)?$'
          ./cell ps
          ./cell completion zsh > /dev/null
          if ./cell launch --repo . 2>/dev/null; then
            echo "launch must fail without root"; exit 1
          fi
          ./cell launch --repo . 2>&1 | grep -F 'requires root — run: sudo cell launch'

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
