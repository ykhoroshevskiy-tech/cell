name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build (git-derived version)
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          if desc="$(git describe --tags --first-parent 2>/dev/null)"; then
            version="$(printf '%s' "$desc" | sed -E 's/^v//; s/(.*)-g([0-9a-f]+)$/\1+g\2/')"
          else
            version="0.0.0-dev+g${short_sha}"
          fi
          echo "cell ${version}"
          go build -ldflags "-X github.com/ykhoroshevskiy-tech/cell/internal/version.Version=${version}" -o cell ./cmd/cell
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false
      - name: Behavioral gates (unprivileged)
        run: |
          ./cell version | grep -E '^cell [0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?(\+g[0-9a-f]+)?([^+]*dirty)?$'
          ./cell ps
          ./cell completion zsh > /dev/null
          if ./cell launch --repo . 2>/dev/null; then
            echo "launch must fail without root"; exit 1
          fi
          ./cell launch --repo . 2>&1 | grep -F 'requires root — run: sudo cell launch'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13.2
